name: Build, release and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check source excludes original material
        run: python3 tools/check-publication.py
      - name: Read Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .tools/downloads
            ~/.local/share/godot/export_templates
          key: godot-release-${{ runner.os }}-${{ steps.godot.outputs.version }}-v1
      - name: Install verified Godot editor and export templates
        run: ./tools/setup-godot.sh
      - name: Run gameplay, UI and persistence tests
        run: ./tools/test.sh
      - name: Export Linux, Windows, macOS and Web
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          version=0.1.0
          if [ "$RELEASE_TYPE" = tag ]; then version="$RELEASE_REF"; fi
          python3 tools/release.py --version "$version"
      - name: Smoke test the Linux release
        run: |
          ".tools/Godot_v$(cat .godot-version)-stable_linux.x86_64" --headless --main-pack "$PWD/release/linux/RaceTheNags.pck" --script "$PWD/tools/verify_pack.gd"
          ".tools/Godot_v$(cat .godot-version)-stable_linux.x86_64" --headless --main-pack "$PWD/release/linux/RaceTheNags.pck" --script "$PWD/tools/verify_public_pack.gd"
          timeout 30 release/linux/RaceTheNags.x86_64 --headless --quit-after 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: release/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: release/site

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "Race the Nags $RELEASE_TAG" --notes-file docs/release-notes.md

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy browser game
        id: deployment
        uses: actions/deploy-pages@v4
